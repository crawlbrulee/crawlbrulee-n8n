name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint, typecheck, test, build)
        run: pnpm verify

      - name: Tarball holds only dist, README and LICENSE
        run: |
          npm pack --dry-run --json | node -e '
            const [pkg] = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const paths = pkg.files.map(f => f.path);
            const allowed = /^(dist\/|README\.md$|LICENSE$|package\.json$)/;
            // build leftovers that would otherwise slip through the dist/ prefix
            const banned = /(\.tsbuildinfo$|\.d\.ts$|\.js\.map$|^dist\/package\.json$)/;
            const bad = paths.filter((p) => !allowed.test(p) || banned.test(p));
            if (bad.length) { console.error("unexpected files in tarball:", bad); process.exit(1); }
          '
