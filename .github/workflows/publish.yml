name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub environment for the publish step. Protection rules (required
    # reviewers / wait timer / tag restrictions) require a public repo or a paid
    # plan; on a private + Free repo this runs unprotected but is ready to gate
    # the moment that changes. Also the optional match condition for the npm
    # trusted publisher (scope it to environment "npm" on npmjs.com to enforce).
    environment:
      name: npm
      url: https://www.npmjs.com/package/n8n-nodes-crawlbrulee
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC trusted publishing + provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so we can check the tag's commit is on main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          # TEMPORARY (bootstrap publish of 0.1.0 only). npm will not let you
          # configure a trusted publisher for a package name that does not exist
          # yet, so the first release authenticates with a short-lived granular
          # token. registry-url makes setup-node write the .npmrc that picks up
          # NODE_AUTH_TOKEN. Provenance is unaffected: it comes from the
          # workflow's OIDC identity, not from how npm authenticates.
          #
          # REVERT THIS (and the NODE_AUTH_TOKEN below) once the trusted
          # publisher is configured: without registry-url, npm >= 11.5 plus
          # id-token: write does the OIDC exchange on its own.
          registry-url: https://registry.npmjs.org

      - name: Verify tagged commit is on main
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '(^|[[:space:]])origin/main$'; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on origin/main. Refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION."
            exit 1
          fi

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint, format, typecheck, test, build)
        # Also the only step that fills dist/, which is git-ignored and is the
        # single entry in package.json "files".
        run: pnpm verify

      - name: Tarball holds only dist, README and LICENSE
        run: npm pack --dry-run --json | node scripts/check-tarball.mjs

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: npm >= 11.5 performs OIDC token exchange via the
        # trusted publisher configured for this repo on npmjs.com.
        #
        # RELEASE_MODE: prepublishOnly is `n8n-node prerelease`, which exits 1
        # unless that variable is set — the n8n CLI wants you to publish with
        # `n8n-node release`. We publish with plain `npm publish` + OIDC like the
        # other crawlbrulee packages, so we set it and let the check pass.
        #
        # --provenance: this repo is public, so npm can generate a provenance
        # attestation (it verifies the Sigstore bundle against publicly visible
        # source). n8n also requires provenance for community nodes.
        env:
          RELEASE_MODE: 'true'
          # TEMPORARY: bootstrap token for the first publish. Remove with the
          # registry-url above once the trusted publisher exists.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
